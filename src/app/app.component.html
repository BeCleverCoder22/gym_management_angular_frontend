<div class="app-container">
  <app-header *ngIf="authService.isAuthenticated()"></app-header>
  
  <div class="main-container" [class.with-sidebar]="authService.isAuthenticated()">
    <app-sidebar *ngIf="authService.isAuthenticated()"></app-sidebar>
    
    <main class="content">
      <router-outlet></router-outlet>
    </main>
  </div>
  
  <app-footer *ngIf="authService.isAuthenticated()"></app-footer>
</div>
