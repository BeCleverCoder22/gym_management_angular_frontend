<div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card">
          <div class="card-header">
            <h2 class="mb-0">{{ isEdit ? 'Modifier' : 'Nouveau' }} Client</h2>
          </div>
          
          <div class="card-body">
            <form [formGroup]="customerForm" (ngSubmit)="onSubmit()">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="lastName" class="form-label">Nom</label>
                  <input
                    type="text"
                    id="lastName"
                    formControlName="lastName"
                    class="form-control"
                    [class.is-invalid]="customerForm.get('lastName')?.invalid && customerForm.get('lastName')?.touched"
                  >
                  <div class="invalid-feedback">
                    Le nom est requis
                  </div>
                </div>
  
                <div class="col-md-6 mb-3">
                  <label for="firstName" class="form-label">Prénom</label>
                  <input
                    type="text"
                    id="firstName"
                    formControlName="firstName"
                    class="form-control"
                    [class.is-invalid]="customerForm.get('firstName')?.invalid && customerForm.get('firstName')?.touched"
                  >
                  <div class="invalid-feedback">
                    Le prénom est requis
                  </div>
                </div>
              </div>
  
              <div class="mb-3">
                <label for="phoneNumber" class="form-label">Téléphone</label>
                <input
                  type="tel"
                  id="phoneNumber"
                  formControlName="phoneNumber"
                  class="form-control"
                  [class.is-invalid]="customerForm.get('phoneNumber')?.invalid && customerForm.get('phoneNumber')?.touched"
                >
                <div class="invalid-feedback">
                  Numéro de téléphone invalide (10 chiffres requis)
                </div>
              </div>
  
              <div class="mb-3">
                <div class="form-check">
                  <input
                    type="checkbox"
                    id="activeSubscription"
                    formControlName="activeSubscription"
                    class="form-check-input"
                  >
                  <label class="form-check-label" for="activeSubscription">
                    Abonnement actif
                  </label>
                </div>
              </div>
  
              <div class="d-flex justify-content-between">
                <button type="button" class="btn btn-secondary" routerLink="/customers">
                  Annuler
                </button>
                <button
                  type="submit"
                  class="btn btn-primary"
                  [disabled]="customerForm.invalid || loading"
                >
                  {{ loading ? 'Enregistrement...' : 'Enregistrer' }}
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
