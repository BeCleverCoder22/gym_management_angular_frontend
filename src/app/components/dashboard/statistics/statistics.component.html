<div class="dashboard-container">
  <h1 class="mb-4">Tableau de bord</h1>

  <!-- Cards des statistiques principales -->
  <div class="row mb-4">
    <div class="col-md-6">
      <div class="card stats-card">
        <div class="card-body">
          <h5 class="card-title">Clients actifs</h5>
          <div class="stats-value" *ngIf="!loading">
            {{ statistics.totalActiveCustomers }}
          </div>
          <div class="placeholder-glow" *ngIf="loading">
            <span class="placeholder col-6"></span>
          </div>
          <i class="bi bi-people stats-icon"></i>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card stats-card">
        <div class="card-body">
          <h5 class="card-title">Revenu mensuel estimé</h5>
          <div class="stats-value" *ngIf="!loading">
            {{ statistics.monthlyRevenue ? (statistics.monthlyRevenue | currency:'XOF':'symbol':'1.0-0') : '-' }}
          </div>
          <div class="placeholder-glow" *ngIf="loading">
            <span class="placeholder col-6"></span>
          </div>
          <i class="bi bi-currency-euro stats-icon"></i>
        </div>
      </div>
    </div>
  </div>

  <!-- Section d'exportation -->
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Exporter les données des abonnements</h5>
      
      <form [formGroup]="exportForm" (ngSubmit)="exportSubscriptions()" class="mt-3">
        <div class="row">
          <div class="col-md-5">
            <div class="form-group">
              <label for="startDate">Date de début</label>
              <input 
                type="date" 
                id="startDate"
                formControlName="startDate"
                class="form-control"
                [class.is-invalid]="exportForm.get('startDate')?.invalid && exportForm.get('startDate')?.touched"
              >
            </div>
          </div>
          
          <div class="col-md-5">
            <div class="form-group">
              <label for="endDate">Date de fin</label>
              <input 
                type="date" 
                id="endDate"
                formControlName="endDate"
                class="form-control"
                [class.is-invalid]="exportForm.get('endDate')?.invalid && exportForm.get('endDate')?.touched"
              >
            </div>
          </div>
          
          <div class="col-md-2 d-flex align-items-end">
            <button 
              type="submit" 
              class="btn btn-primary w-100"
              [disabled]="exportForm.invalid || exporting"
            >
              <i class="bi bi-download me-2"></i>
              {{ exporting ? 'Exportation...' : 'Exporter' }}
            </button>
          </div>
        </div>
      </form>

      <!-- Message de succès après export -->
      <div class="alert alert-success mt-3" *ngIf="exportSuccess">
        Fichier exporté avec succès !
      </div>

      <!-- Message d'erreur -->
      <div class="alert alert-danger mt-3" *ngIf="error">
        {{ error }}
      </div>
    </div>
  </div>
</div>
