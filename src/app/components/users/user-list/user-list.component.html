<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Gestion des Utilisateurs</h2>
      <a routerLink="/users/new" class="btn btn-primary">
        <i class="bi bi-plus"></i> Nouvel Utilisateur
      </a>
    </div>
  
    <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  
    <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Nom d'utilisateur</th>
            <th>Email</th>
            <th>Rôle</th>
            <th>Date de création</th>
            <!-- <th>Dernière connexion</th> -->
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>{{ user.role }}</td>
            <td>{{ user.createdAt | date:'short' }}</td>
            <!-- <td>{{ user.lastLogin | date:'short' }}</td> -->
            <td>
              <div class="btn-group">
                <a [routerLink]="['/users/edit', user.id]" class="btn btn-sm btn-outline-primary">
                  <i class="bi bi-pencil"></i>
                </a>
                <button class="btn btn-sm btn-outline-danger" *ngIf="user.id !== undefined" (click)="deleteUser(user.id)">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
  
      <div class="text-center my-4" *ngIf="loading">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Chargement...</span>
        </div>
      </div>
    </div>
  </div>
