<div class="container mt-4">
    <h2>{{ isEditMode ? 'Modifier' : 'Créer' }} un utilisateur</h2>
  
    <div class="card mt-4">
      <div class="card-body">
        <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="username" class="form-label">Nom d'utilisateur</label>
            <input
              type="text"
              id="username"
              formControlName="username"
              class="form-control"
              [class.is-invalid]="userForm.get('username')?.invalid && userForm.get('username')?.touched"
            >
            <div class="invalid-feedback" *ngIf="userForm.get('username')?.errors?.['required']">
              Le nom d'utilisateur est requis
            </div>
            <div class="invalid-feedback" *ngIf="userForm.get('username')?.errors?.['minlength']">
              Le nom d'utilisateur doit contenir au moins 4 caractères
            </div>
          </div>
  
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              id="email"
              formControlName="email"
              class="form-control"
              [class.is-invalid]="userForm.get('email')?.invalid && userForm.get('email')?.touched"
            >
            <div class="invalid-feedback" *ngIf="userForm.get('email')?.errors?.['required']">
              L'email est requis
            </div>
            <div class="invalid-feedback" *ngIf="userForm.get('email')?.errors?.['email']">
              L'email n'est pas valide
            </div>
          </div>
  
          <div class="mb-3" *ngIf="!isEditMode">
            <label for="password" class="form-label">Mot de passe</label>
            <input
              type="password"
              id="password"
              formControlName="password"
              class="form-control"
              [class.is-invalid]="userForm.get('password')?.invalid && userForm.get('password')?.touched"
            >
            <div class="invalid-feedback" *ngIf="userForm.get('password')?.errors?.['required']">
              Le mot de passe est requis
            </div>
            <div class="invalid-feedback" *ngIf="userForm.get('password')?.errors?.['minlength']">
              Le mot de passe doit contenir au moins 6 caractères
            </div>
          </div>
  
          <div class="mb-3">
            <label for="role" class="form-label">Rôle</label>
            <select
              id="role"
              formControlName="role"
              class="form-select"
              [class.is-invalid]="userForm.get('role')?.invalid && userForm.get('role')?.touched"
            >
              <option value="">Sélectionner un rôle</option>
              <option value="ADMIN">Administrateur</option>
              <option value="USER">Utilisateur</option>
            </select>
            <div class="invalid-feedback" *ngIf="userForm.get('role')?.errors?.['required']">
              Le rôle est requis
            </div>
          </div>
  
          <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  
          <div class="d-flex justify-content-between">
            <button type="button" class="btn btn-secondary" routerLink="/users">
              Annuler
            </button>
            <button 
              type="submit" 
              class="btn btn-primary" 
              [disabled]="userForm.invalid || loading"
            >
              <span class="spinner-border spinner-border-sm me-2" *ngIf="loading"></span>
              {{ isEditMode ? 'Modifier' : 'Créer' }}
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
