<div class="profile-container">
  <h1 class="mb-4">Mon Profil</h1>

  <!-- Informations du profil -->
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title">Informations personnelles</h5>
      
      <form [formGroup]="profileForm" (ngSubmit)="onProfileSubmit()">
        <div class="form-group">
          <label for="username">Nom d'utilisateur</label>
          <input
            type="text"
            id="username"
            formControlName="username"
            class="form-control"
            readonly
          >
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-control"
            [class.is-invalid]="profileForm.get('email')?.invalid && profileForm.get('email')?.touched"
          >
          <div class="invalid-feedback" *ngIf="profileForm.get('email')?.errors?.['required']">
            L'email est requis
          </div>
          <div class="invalid-feedback" *ngIf="profileForm.get('email')?.errors?.['email']">
            L'email n'est pas valide
          </div>
        </div>

        <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
        <div class="alert alert-success" *ngIf="success">{{ success }}</div>

        <button 
          type="submit" 
          class="btn btn-primary"
          [disabled]="profileForm.invalid || loading"
        >
          {{ loading ? 'Enregistrement...' : 'Enregistrer les modifications' }}
        </button>
      </form>
    </div>
  </div>

  <!-- Changement de mot de passe -->
  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Changer le mot de passe</h5>
      
      <form [formGroup]="passwordForm" (ngSubmit)="onPasswordSubmit()">
        <div class="form-group">
          <label for="oldPassword">Ancien mot de passe</label>
          <input
            type="password"
            id="oldPassword"
            formControlName="oldPassword"
            class="form-control"
            [class.is-invalid]="passwordForm.get('oldPassword')?.invalid && passwordForm.get('oldPassword')?.touched"
          >
        </div>

        <div class="form-group">
          <label for="newPassword">Nouveau mot de passe</label>
          <input
            type="password"
            id="newPassword"
            formControlName="newPassword"
            class="form-control"
            [class.is-invalid]="passwordForm.get('newPassword')?.invalid && passwordForm.get('newPassword')?.touched"
          >
          <div class="invalid-feedback" *ngIf="passwordForm.get('newPassword')?.errors?.['minlength']">
            Le mot de passe doit contenir entre 12 et 72 caractères
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmer le nouveau mot de passe</label>
          <input
            type="password"
            id="confirmPassword"
            formControlName="confirmPassword"
            class="form-control"
            [class.is-invalid]="passwordForm.errors?.['mismatch']"
          >
          <div class="invalid-feedback" *ngIf="passwordForm.errors?.['mismatch']">
            Les mots de passe ne correspondent pas
          </div>
        </div>

        <div class="alert alert-danger" *ngIf="passwordError">{{ passwordError }}</div>
        <div class="alert alert-success" *ngIf="passwordSuccess">{{ passwordSuccess }}</div>

        <button 
          type="submit" 
          class="btn btn-primary"
          [disabled]="passwordForm.invalid || loading"
        >
          {{ loading ? 'Modification...' : 'Modifier le mot de passe' }}
        </button>
      </form>
    </div>
  </div>
</div>
