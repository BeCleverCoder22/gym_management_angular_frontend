<header class="app-header">
  <a class="brand-lockup" routerLink="/dashboard"><span class="brand-mark">G</span><span>GYM<span class="brand-light">MANAGER</span></span></a>
  <div class="header-context"><span class="context-dot"></span><span>{{ organizationLabel || 'Espace de gestion' }}</span></div>
  <div class="header-actions">
    <a class="header-profile" routerLink="/profile"><i class="bi bi-person-circle" aria-hidden="true"></i><span>{{ authService.currentUserSubjectValue?.username || 'Mon profil' }}</span></a>
    <button class="icon-action" type="button" (click)="logout()" aria-label="Se déconnecter" title="Se déconnecter"><i class="bi bi-box-arrow-right" aria-hidden="true"></i></button>
  </div>
  <span class="logout-error" *ngIf="logoutError" role="alert">{{ logoutError }}</span>
</header>
