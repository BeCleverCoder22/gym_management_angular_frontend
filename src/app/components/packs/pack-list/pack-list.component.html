<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Liste des Offres</h2>
      <a routerLink="/packs/new" class="btn btn-primary">
        <i class="bi bi-plus"></i> Nouvelle Offre
      </a>
    </div>
  
    <div class="card">
      <div class="table-responsive">
        <table class="table table-hover mb-0">
          <thead>
            <tr>
              <th>Nom de l'offre</th>
              <th>Durée (mois)</th>
              <th>Prix mensuel</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="loading">
              <td colspan="4" class="text-center py-4">Chargement...</td>
            </tr>
            <tr *ngIf="!loading && packs.length === 0">
              <td colspan="4" class="text-center py-4">Aucune offre trouvée</td>
            </tr>
            <tr *ngFor="let pack of packs">
              <td>{{ pack.offerName }}</td>
              <td>{{ pack.durationMonths }}</td>
              <td>{{ pack.monthlyPrice | currency:'XOF' }}</td>
              <td>
                <div class="btn-group">
                  <a [routerLink]="['/packs/edit', pack.id]" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-pencil"></i>
                  </a>
                  <button (click)="deletePack(pack.id!)" class="btn btn-sm btn-outline-danger">
                    <i class="bi bi-trash"></i>
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
