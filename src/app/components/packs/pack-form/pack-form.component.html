<div class="pack-form-container">
    <div class="card">
      <div class="card-body">
        <h2 class="card-title mb-4">{{ isEditing ? 'Modifier l\'offre' : 'Nouvelle offre' }}</h2>
  
        <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
  
        <form [formGroup]="packForm" (ngSubmit)="onSubmit()">
          <div class="mb-3">
            <label for="offerName" class="form-label">Nom de l'offre</label>
            <input
              type="text"
              id="offerName"
              formControlName="offerName"
              class="form-control"
              [class.is-invalid]="packForm.get('offerName')?.invalid && packForm.get('offerName')?.touched"
            >
            <div class="invalid-feedback" *ngIf="packForm.get('offerName')?.errors?.['required']">
              Le nom de l'offre est requis
            </div>
            <div class="invalid-feedback" *ngIf="packForm.get('offerName')?.errors?.['minlength']">
              Le nom de l'offre doit contenir au moins 3 caractères
            </div>
          </div>
  
          <div class="mb-3">
            <label for="durationMonths" class="form-label">Durée (mois)</label>
            <input
              type="number"
              id="durationMonths"
              formControlName="durationMonths"
              class="form-control"
              [class.is-invalid]="packForm.get('durationMonths')?.invalid && packForm.get('durationMonths')?.touched"
            >
            <div class="invalid-feedback" *ngIf="packForm.get('durationMonths')?.errors?.['required']">
              La durée est requise
            </div>
            <div class="invalid-feedback" *ngIf="packForm.get('durationMonths')?.errors?.['min']">
              La durée doit être supérieure à 0
            </div>
          </div>
  
          <div class="mb-4">
            <label for="monthlyPrice" class="form-label">Prix mensuel</label>
            <div class="input-group">
              <span class="input-group-text">FCFA</span>
              <input
                type="number"
                id="monthlyPrice"
                formControlName="monthlyPrice"
                class="form-control"
                [class.is-invalid]="packForm.get('monthlyPrice')?.invalid && packForm.get('monthlyPrice')?.touched"
              >
            </div>
            <div class="invalid-feedback" *ngIf="packForm.get('monthlyPrice')?.errors?.['required']">
              Le prix mensuel est requis
            </div>
            <div class="invalid-feedback" *ngIf="packForm.get('monthlyPrice')?.errors?.['min']">
              Le prix doit être supérieur ou égal à 0
            </div>
          </div>
  
          <div class="d-flex gap-2">
            <button 
              type="submit" 
              class="btn btn-primary"
              [disabled]="packForm.invalid || loading"
            >
              <i class="bi" [class.bi-save]="!loading" [class.bi-hourglass-split]="loading"></i>
              {{ loading ? 'Enregistrement...' : 'Enregistrer' }}
            </button>
            <button 
              type="button" 
              class="btn btn-outline-secondary"
              routerLink="/packs"
              [disabled]="loading"
            >
              Annuler
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
